seed: 42
dataset_type: toy_npz
train_npz: outputs/datasets/toy_fire_train.npz
val_npz: outputs/datasets/toy_fire_val.npz
test_npz: outputs/datasets/toy_fire_test.npz

obs_window: 4
horizon: 5
in_channels: 5
image_size: 64
batch_size: 16
epochs: 50
learning_rate: 1e-4
alpha_unc: 0.1
lambda_u: 0.5
dropout_p: 0.1
num_mc_samples: 5
uncertainty_alpha: 0.7

base_channels: 16
latent_channels: 64
gru_layers: 1
num_workers: 0
checkpoint_dir: outputs/checkpoints_toy
log_dir: outputs/runs_toy
visualization_dir: outputs/visualizations
output_dir: outputs
training_log_csv: outputs/results/stage4_toy_training_log.csv

num_trajectories: 64
risk_threshold_delta: 1.2
goal_weight: 0.3
progress_weight: 0.2
backtrack_penalty: 1.0
trajectory_noise_scale: 4.0

env:
  map_size: 64
  max_steps: 100
  num_fire_sources: 2
  obstacle_density: 0.05
  fire_spread_rate: 0.04
  smoke_spread_rate: 0.08
  risk_threshold_collision: 0.95
  goal_radius: 3.0
  max_step_size: 2.0
