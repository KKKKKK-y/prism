batch_size: 8
lr: 1e-4
epochs: 100
dataset_type: dummy
train_npz: outputs/datasets/toy_fire_train.npz
val_npz: outputs/datasets/toy_fire_val.npz
test_npz: outputs/datasets/toy_fire_test.npz
horizon: 5
obs_window: 4
channels: 6
image_size: 64
base_channels: 32
latent_channels: 128
gru_layers: 1
dropout_p: 0.1
num_mc_samples: 5
uncertainty_alpha: 0.7
num_trajectories: 64
risk_threshold_delta: 1.2
goal_weight: 0.3
progress_weight: 0.2
backtrack_penalty: 1.0
trajectory_noise_scale: 4.0
num_workers: 0
amp: true
grad_clip_norm: 1.0
uncertainty_weight: 0.1
lambda_u: 0.5
log_interval: 10
output_dir: prism/outputs

data:
  train_root:
  val_root:
  train_samples: 128
  val_samples: 32
  seed: 42

env:
  map_size: 64
  max_steps: 100
  num_fire_sources: 2
  obstacle_density: 0.05
  fire_spread_rate: 0.04
  smoke_spread_rate: 0.08
  risk_threshold_collision: 0.95
  goal_radius: 3.0
  max_step_size: 2.0
